# Inference & fusion configuration
# Used by scripts/run_all.py and scripts/run_webcam.py

# Default backend at startup.
# Detection-only backends:
#   yolo     - YOLO only
#   rtdetr   - RT-DETR only
#   ensemble - YOLO + RT-DETR fused (score-combined detections)
# Plus the video model:
#   video    - PyTorchVideo action classifier only
# Combinations:
#   all      - YOLO + RT-DETR (ensemble) + video
#   both     - alias for "all" (kept for v1/v2 compatibility)
default_backend: all

# Camera
camera_index: 0          # 0 = default webcam
frame_width: 1280
frame_height: 720

# Model paths (filled in after training/export)
# These can point to either .pt (native) or .onnx
yolo_weights: runs/yolo/train/weights/best.pt
yolo_onnx: runs/yolo/train/weights/best.onnx
rtdetr_weights: runs/rtdetr/train/weights/best.pt
rtdetr_onnx: runs/rtdetr/train/weights/best.onnx
video_weights: runs/video/best.pt
video_onnx: runs/video/best.onnx

# Prefer ONNX if available (faster, unified runtime). false = native PyTorch.
prefer_onnx: true

# YOLO inference
yolo_conf: 0.25
yolo_iou: 0.45
yolo_imgsz: 640

# RT-DETR inference
rtdetr_conf: 0.25
rtdetr_iou: 0.45
rtdetr_imgsz: 640

# Detector ensemble fusion (when backend includes both YOLO and RT-DETR)
ensemble_iou_threshold: 0.5    # min IoU for two boxes to be considered the same object
ensemble_method: average       # average | weighted | multiply | max
ensemble_weight_yolo: 1.0      # only used when ensemble_method == weighted
ensemble_weight_rtdetr: 1.0
ensemble_unmatched_penalty: 0.7  # multiply conf for detections only one detector saw

# Video inference
video_clip_len: 8        # must match training num_frames
video_sampling_rate: 8
video_crop_size: 224
video_side_size: 256
video_topk: 3            # show top-k action predictions
# Class label map for the action model (one per line, index = class id)
video_labels_file: configs/video_labels.txt

# Fusion
# How to combine YOLO + Video outputs when backend = "both":
#   concat   - just report both side by side
#   weighted - weight by per-model confidence (for downstream alerting rules)
fusion_mode: concat

# Display
show_fps: true
show_help_overlay: true
